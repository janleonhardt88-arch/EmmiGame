name: Spiel auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, 'ccr-**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer eintragen
        run: |
          BUILD="$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/" app/sw.js app/js/version.js
          echo "{\"build\": \"${BUILD}\"}" > app/version.json
          echo "Version: ${BUILD}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
